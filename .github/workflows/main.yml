name: ASPICE Workflow

on:
  push:

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: '3.12'

      - name: Validate Requirements

        run: python scripts/validate_requirements.py
